name: Local Bridge Run-Now v1 Release

on:
  push:
    branches:
      - exp/local-bridge-run-now-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: local-bridge-run-now-v1
  cancel-in-progress: true

env:
  BASE_TAG: local-bridge-runnow-41aa0f6
  BASE_COMMIT: 41aa0f605418d9a710268992ada994126e8b0406
  OWNER_BASE_TAG: local-bridge-runnow-de8284e
  OWNER_BASE_COMMIT: de8284e1cbe0213d17ff54d3c725eaa31706a101

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate bridge adapter
        run: node --check .\src\ChatGptDesktopLocalBridge\Web\bridge-adapter.js

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\ChatGptDesktopLocalBridge.sln
          dotnet restore .\src\ChatGptDesktopLocalBridge\ChatGptDesktopLocalBridge.csproj --runtime win-x64

      - name: Build
        run: dotnet build .\ChatGptDesktopLocalBridge.sln --configuration Release --no-restore

      - name: Test runtime foundation
        run: dotnet run --project .\tests\ChatGptDesktopLocalBridge.LedgerTests\ChatGptDesktopLocalBridge.LedgerTests.csproj --configuration Release --no-build

      - name: Set release identity
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}"
          $short = $sha.Substring(0, 7)
          $tag = "local-bridge-runnow-$short"
          $version = "0.3.${{ github.run_number }}.0"
          "TARGET_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish target
        shell: pwsh
        run: |
          dotnet publish .\src\ChatGptDesktopLocalBridge\ChatGptDesktopLocalBridge.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output .\publish\win-x64
          [ordered]@{
            schema = "chatgpt-desktop-local-bridge-release-v1"
            tag = $env:TARGET_TAG
            commit = "${{ github.sha }}"
            appVersion = $env:APP_VERSION
          } | ConvertTo-Json | Set-Content .\publish\win-x64\release-info.json -Encoding UTF8

      - name: Create publish manifest
        shell: pwsh
        run: |
          .\scripts\create-publish-manifest.ps1 -PublishDir .\publish\win-x64 -Tag $env:TARGET_TAG -Commit "${{ github.sha }}" -OutputPath .\ChatGptDesktopLocalBridge-PublishManifest.json

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build full setup
        shell: pwsh
        run: |
          $sourceDir = (Resolve-Path ".\publish\win-x64").Path
          $outputDir = $PWD.Path
          ISCC.exe "/DMyAppVersion=$env:APP_VERSION" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" ".\installer\ChatGptDesktopLocalBridge.iss"
          if (-not (Test-Path ".\ChatGptDesktopLocalBridge-Setup.exe")) { throw "Full setup was not produced." }
          Move-Item ".\ChatGptDesktopLocalBridge-Setup.exe" ".\ChatGptDesktopLocalBridge-RunNow-Setup.exe" -Force

      - name: Download exact base manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path .\base-manifest -Force | Out-Null
          gh release download $env:BASE_TAG --pattern "ChatGptDesktopLocalBridge-PublishManifest.json" --dir .\base-manifest --clobber
          if (-not (Test-Path ".\base-manifest\ChatGptDesktopLocalBridge-PublishManifest.json")) { throw "Base manifest was not downloaded." }

      - name: Verify installed-owner base is source-equivalent
        shell: pwsh
        run: |
          $drift = @(git diff --name-only $env:OWNER_BASE_COMMIT $env:BASE_COMMIT -- src installer scripts)
          if ($drift.Count -gt 0) {
            throw "Owner base and exact base differ in packaged source: $($drift -join ', ')"
          }
          Write-Host "Owner base differs from exact release only outside packaged application source."

      - name: Build exact incremental updater
        shell: pwsh
        run: |
          $deltaDir = Join-Path $PWD "delta-runnow-v1"
          .\scripts\build-delta-update.ps1 -BaseManifestPath .\base-manifest\ChatGptDesktopLocalBridge-PublishManifest.json -CurrentPublishDir .\publish\win-x64 -BaseTag $env:BASE_TAG -TargetTag $env:TARGET_TAG -TargetCommit "${{ github.sha }}" -OutputPath $deltaDir
          $resolvedDelta = (Resolve-Path $deltaDir).Path
          ISCC.exe "/DDeltaDir=$resolvedDelta" "/DOutputDir=$PWD" "/DBaseTag=$env:BASE_TAG" "/DTargetTag=$env:TARGET_TAG" "/DUpdateVersion=$env:APP_VERSION" ".\installer\DeltaUpdate.iss"
          $expected = ".\ChatGptDesktopLocalBridge-Update-from-$($env:BASE_TAG).exe"
          if (-not (Test-Path $expected)) { throw "Incremental updater was not produced." }

      - name: Build installed-owner compatible updater
        shell: pwsh
        run: |
          $sourceDelta = Join-Path $PWD "delta-runnow-v1"
          $compatDelta = Join-Path $PWD "delta-owner-base"
          Copy-Item -LiteralPath $sourceDelta -Destination $compatDelta -Recurse -Force

          $manifestPath = Join-Path $compatDelta "update-manifest.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $manifest.fromTag = $env:OWNER_BASE_TAG
          $manifest.baseline = @($manifest.baseline | Where-Object { [string]$_.path -ne "release-info.json" })
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $manifestPath -Encoding UTF8

          $resolvedCompat = (Resolve-Path $compatDelta).Path
          ISCC.exe "/DDeltaDir=$resolvedCompat" "/DOutputDir=$PWD" "/DBaseTag=$env:OWNER_BASE_TAG" "/DTargetTag=$env:TARGET_TAG" "/DUpdateVersion=$env:APP_VERSION" ".\installer\DeltaUpdate.iss"
          $expected = ".\ChatGptDesktopLocalBridge-Update-from-$($env:OWNER_BASE_TAG).exe"
          if (-not (Test-Path $expected)) { throw "Owner-base updater was not produced." }

      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TARGET_TAG ".\ChatGptDesktopLocalBridge-RunNow-Setup.exe" ".\ChatGptDesktopLocalBridge-PublishManifest.json" ".\ChatGptDesktopLocalBridge-Update-from-$($env:BASE_TAG).exe" ".\ChatGptDesktopLocalBridge-Update-from-$($env:OWNER_BASE_TAG).exe" --target "${{ github.sha }}" --prerelease --title "Local Bridge run-now test ($env:TARGET_TAG)" --notes "Update: pressing 'Мост' while the bridge is already active resends the complete current Local Bridge instruction to the model without changing the session. process.run keeps the 120-second default but timeout_ms=0 now means unlimited runtime; the old 15-minute hard ceiling is removed. Includes a compatibility updater for the owner's installed de8284e build; de8284e and 41aa0f6 differ only in non-packaged PC-gateway test scripts. Network requests inside the planner remain serialized with at least 5 seconds between completed requests."
