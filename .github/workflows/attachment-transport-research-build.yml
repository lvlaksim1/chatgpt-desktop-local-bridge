name: Attachment transport research build

on:
  push:
    branches:
      - research/attachment-task-transport

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish research client
        shell: pwsh
        run: dotnet publish src/ChatGptDesktopLocalBridge/ChatGptDesktopLocalBridge.csproj -c Release -r win-x64 --self-contained false -o research-publish --disable-build-servers
      - uses: actions/upload-artifact@v4
        with:
          name: attachment-research-publish
          path: research-publish/
          retention-days: 1
