name: Windows Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\ChatGptDesktopLocalBridge.sln

      - name: Build
        run: dotnet build .\ChatGptDesktopLocalBridge.sln --configuration Release --no-restore

      - name: Publish self-contained win-x64 test build
        run: >-
          dotnet publish .\src\ChatGptDesktopLocalBridge\ChatGptDesktopLocalBridge.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output .\publish\win-x64

      - name: Pack portable test build
        shell: pwsh
        run: |
          $zip = Join-Path $PWD "ChatGptDesktopLocalBridge-win-x64.zip"
          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }
          Compress-Archive -Path .\publish\win-x64\* -DestinationPath $zip

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          Get-Command ISCC.exe

      - name: Build upgradeable Windows installer
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}.0"
          $sourceDir = (Resolve-Path ".\publish\win-x64").Path
          $outputDir = $PWD.Path
          ISCC.exe "/DMyAppVersion=$version" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" ".\installer\ChatGptDesktopLocalBridge.iss"
          if (-not (Test-Path ".\ChatGptDesktopLocalBridge-Setup.exe")) {
            throw "Installer was not produced."
          }

      - name: Verify GitHub CLI
        run: gh --version

      - name: Create development prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[dev-release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = "${{ github.sha }}"
          $short = $sha.Substring(0, 7)
          $tag = "dev-$short"
          gh release create $tag .\ChatGptDesktopLocalBridge-Setup.exe .\ChatGptDesktopLocalBridge-win-x64.zip --target $sha --prerelease --title "Development build $short" --notes "Windows installer upgrades an existing installation in place. The WebView2 user profile is stored outside the install directory so ChatGPT sign-in state survives application upgrades. A portable ZIP is also attached for diagnostics."
