name: Windows Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate Web adapter JavaScript
        run: node --check .\src\ChatGptDesktopLocalBridge\Web\bridge-adapter.js

      - name: Validate update PowerShell syntax
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content .\scripts\build-delta-update.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content .\scripts\create-publish-manifest.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content .\scripts\update\Apply-Update.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content .\src\ChatGptDesktopLocalBridge\Support\Uninstall-Bridge.ps1 -Raw)) | Out-Null

      - name: Restore
        run: dotnet restore .\ChatGptDesktopLocalBridge.sln

      - name: Build
        run: dotnet build .\ChatGptDesktopLocalBridge.sln --configuration Release --no-restore

      - name: Publish self-contained win-x64 test build
        run: >-
          dotnet publish .\src\ChatGptDesktopLocalBridge\ChatGptDesktopLocalBridge.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output .\publish\win-x64

      - name: Stamp release identity
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}"
          $short = $sha.Substring(0, 7)
          $tag = "dev-$short"
          $version = "0.1.${{ github.run_number }}.0"

          [ordered]@{
            schema = "chatgpt-desktop-local-bridge-release-v1"
            tag = $tag
            commit = $sha
            appVersion = $version
          } | ConvertTo-Json | Set-Content .\publish\win-x64\release-info.json -Encoding UTF8

      - name: Smoke-test exact manifest and delta package builder
        shell: pwsh
        run: |
          .\scripts\create-publish-manifest.ps1 -PublishDir .\publish\win-x64 -Tag smoke-base -Commit "${{ github.sha }}" -OutputPath .\publish-manifest-smoke.json
          .\scripts\build-delta-update.ps1 -BaseManifestPath .\publish-manifest-smoke.json -CurrentPublishDir .\publish\win-x64 -BaseTag smoke-base -TargetTag smoke-target -TargetCommit "${{ github.sha }}" -OutputPath .\delta-smoke
          if (-not (Test-Path .\delta-smoke\update-manifest.json)) { throw "Delta smoke directory was not created." }
          $manifest = Get-Content .\delta-smoke\update-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.schema -ne "chatgpt-desktop-local-bridge-delta-v1") { throw "Unexpected delta manifest schema." }
          if ($manifest.baseValidationMode -ne "exact") { throw "Smoke delta is not using exact validation." }
          if (@($manifest.files).Count -ne 0) { throw "Zero-delta smoke test unexpectedly contains changed files." }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          Get-Command ISCC.exe

      - name: Smoke-test single-file update EXE
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}.0"
          $deltaDir = (Resolve-Path ".\delta-smoke").Path
          $outputDir = $PWD.Path
          ISCC.exe "/DDeltaDir=$deltaDir" "/DOutputDir=$outputDir" "/DBaseTag=smoke-base" "/DTargetTag=smoke-target" "/DUpdateVersion=$version" ".\installer\DeltaUpdate.iss"
          if (-not (Test-Path ".\ChatGptDesktopLocalBridge-Update-from-smoke-base.exe")) {
            throw "Single-file update smoke EXE was not produced."
          }
          Remove-Item .\ChatGptDesktopLocalBridge-Update-from-smoke-base.exe -Force
          Remove-Item .\delta-smoke -Recurse -Force

      - name: Build upgradeable Windows installer
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}.0"
          $sourceDir = (Resolve-Path ".\publish\win-x64").Path
          $outputDir = $PWD.Path
          ISCC.exe "/DMyAppVersion=$version" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" ".\installer\ChatGptDesktopLocalBridge.iss"
          if (-not (Test-Path ".\ChatGptDesktopLocalBridge-Setup.exe")) {
            throw "Installer was not produced."
          }

      - name: E2E legacy update from dev-1d00606
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $legacyTag = "dev-1d00606"
          $legacyCommit = "1d006065462d442e429478158e655e3edc5c7938"
          $legacyVersion = "0.1.24.0"
          $sha = "${{ github.sha }}"
          $short = $sha.Substring(0, 7)
          $targetTag = "dev-$short"
          $targetVersion = "0.1.${{ github.run_number }}.0"

          $legacyWorktree = Join-Path $PWD "e2e-legacy-worktree"
          $legacyPublish = Join-Path $PWD "e2e-legacy-publish"
          $legacyOutput = Join-Path $PWD "e2e-legacy-installer"
          $deltaDir = Join-Path $PWD "e2e-legacy-delta"
          $updateOutput = Join-Path $PWD "e2e-update-output"

          New-Item -ItemType Directory -Path $legacyOutput -Force | Out-Null
          New-Item -ItemType Directory -Path $updateOutput -Force | Out-Null

          git worktree add --detach $legacyWorktree $legacyCommit

          try {
            dotnet publish (Join-Path $legacyWorktree "src\ChatGptDesktopLocalBridge\ChatGptDesktopLocalBridge.csproj") --configuration Release --runtime win-x64 --self-contained true --output $legacyPublish

            ISCC.exe "/DMyAppVersion=$legacyVersion" "/DSourceDir=$legacyPublish" "/DOutputDir=$legacyOutput" (Join-Path $legacyWorktree "installer\ChatGptDesktopLocalBridge.iss")
            $legacySetup = Join-Path $legacyOutput "ChatGptDesktopLocalBridge-Setup.exe"
            if (-not (Test-Path -LiteralPath $legacySetup)) { throw "Legacy setup was not produced." }

            $legacyInstall = Start-Process -FilePath $legacySetup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$PWD\legacy-install.log") -Wait -PassThru
            if ($legacyInstall.ExitCode -ne 0) {
              if (Test-Path "$PWD\legacy-install.log") { Get-Content "$PWD\legacy-install.log" }
              throw "Legacy setup failed with exit code $($legacyInstall.ExitCode)."
            }

            $uninstallKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{7D6B9AF8-6D08-44E1-B2F5-8A6341D99165}_is1"
            $registration = Get-ItemProperty -LiteralPath $uninstallKey -ErrorAction Stop
            $installDir = [string]$registration.InstallLocation
            if ([string]::IsNullOrWhiteSpace($installDir)) {
              $installDir = Join-Path $env:LOCALAPPDATA "Programs\ChatGPT Desktop Local Bridge"
            }

            $installedExe = Join-Path $installDir "ChatGptDesktopLocalBridge.exe"
            if (-not (Test-Path -LiteralPath $installedExe)) {
              if (Test-Path "$PWD\legacy-install.log") { Get-Content "$PWD\legacy-install.log" }
              throw "Legacy application was not installed at '$installDir'."
            }

            $displayVersion = $registration.DisplayVersion
            if ($displayVersion -ne $legacyVersion) { throw "Unexpected installed legacy version '$displayVersion'." }

            .\scripts\build-delta-update.ps1 -BasePublishDir $legacyPublish -LegacyInstallerVersion $legacyVersion -CurrentPublishDir .\publish\win-x64 -BaseTag $legacyTag -TargetTag $targetTag -TargetCommit $sha -OutputPath $deltaDir

            Write-Host "=== direct updater script probe ==="
            $env:CHATGPT_LOCAL_BRIDGE_UPDATE_SKIP_RESTART = "1"
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $deltaDir "Apply-Update.ps1")
            $directExit = $LASTEXITCODE
            if ($directExit -ne 0) {
              throw "Direct Apply-Update.ps1 failed with exit code $directExit."
            }

            $releaseInfo = Join-Path $installDir "release-info.json"
            if (-not (Test-Path -LiteralPath $releaseInfo)) {
              throw "Direct Apply-Update.ps1 returned success but release-info.json was not installed."
            }

            Get-Process -Name "ChatGptDesktopLocalBridge" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $installDir -Recurse -Force
            Remove-Item -LiteralPath $uninstallKey -Recurse -Force -ErrorAction SilentlyContinue

            $legacyInstall2 = Start-Process -FilePath $legacySetup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$PWD\legacy-install-2.log") -Wait -PassThru
            if ($legacyInstall2.ExitCode -ne 0) {
              if (Test-Path "$PWD\legacy-install-2.log") { Get-Content "$PWD\legacy-install-2.log" }
              throw "Second legacy setup failed with exit code $($legacyInstall2.ExitCode)."
            }

            $registration = Get-ItemProperty -LiteralPath $uninstallKey -ErrorAction Stop
            $installDir = [string]$registration.InstallLocation
            if ([string]::IsNullOrWhiteSpace($installDir)) {
              $installDir = Join-Path $env:LOCALAPPDATA "Programs\ChatGPT Desktop Local Bridge"
            }

            $resolvedDelta = (Resolve-Path $deltaDir).Path
            ISCC.exe "/DDeltaDir=$resolvedDelta" "/DOutputDir=$updateOutput" "/DBaseTag=$legacyTag" "/DTargetTag=$targetTag" "/DUpdateVersion=$targetVersion" ".\installer\DeltaUpdate.iss"
            $updateExe = Join-Path $updateOutput "ChatGptDesktopLocalBridge-Update-from-dev-1d00606.exe"
            if (-not (Test-Path -LiteralPath $updateExe)) { throw "Legacy update EXE was not produced." }

            $env:CHATGPT_LOCAL_BRIDGE_UPDATE_SKIP_RESTART = "1"
            $updateRun = Start-Process -FilePath $updateExe -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$PWD\legacy-update.log") -PassThru
            if (-not $updateRun.WaitForExit(120000)) {
              Stop-Process -Id $updateRun.Id -Force -ErrorAction SilentlyContinue
              $updaterLog = Join-Path $env:LOCALAPPDATA "ChatGptDesktopLocalBridge\logs\update-last.log"
              Write-Host "=== updater transcript after timeout ==="
              if (Test-Path -LiteralPath $updaterLog) { Get-Content -LiteralPath $updaterLog }
              Write-Host "=== legacy update installer log after timeout ==="
              if (Test-Path "$PWD\legacy-update.log") { Get-Content "$PWD\legacy-update.log" }
              throw "Legacy update EXE timed out after 120 seconds."
            }
            $updateRun.Refresh()
            if ($updateRun.ExitCode -ne 0) {
              Write-Host "=== legacy update installer log ==="
              if (Test-Path "$PWD\legacy-update.log") { Get-Content "$PWD\legacy-update.log" }
              throw "Legacy update failed with exit code $($updateRun.ExitCode)."
            }

            $releaseInfo = Join-Path $installDir "release-info.json"
            if (-not (Test-Path -LiteralPath $releaseInfo)) {
              $updaterLog = Join-Path $env:LOCALAPPDATA "ChatGptDesktopLocalBridge\logs\update-last.log"
              Write-Host "=== updater transcript ==="
              if (Test-Path -LiteralPath $updaterLog) { Get-Content -LiteralPath $updaterLog }
              Write-Host "=== legacy update installer log ==="
              if (Test-Path "$PWD\legacy-update.log") { Get-Content "$PWD\legacy-update.log" }
              throw "release-info.json was not installed."
            }
            $info = Get-Content -LiteralPath $releaseInfo -Raw | ConvertFrom-Json
            if ($info.tag -ne $targetTag) { throw "Updated release marker '$($info.tag)' does not match '$targetTag'." }

            $updatedRegistration = Get-ItemProperty -LiteralPath $uninstallKey -ErrorAction Stop
            if ([string]$updatedRegistration.UninstallString -notlike "*Uninstall-Bridge.ps1*") {
              throw "Delta update did not register the uninstall wrapper."
            }
            if ([string]::IsNullOrWhiteSpace([string]$updatedRegistration.BridgeOriginalUninstallExe)) {
              throw "Delta update did not preserve the original uninstaller path."
            }

            $dataDir = Join-Path $env:LOCALAPPDATA "ChatGptDesktopLocalBridge"
            New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
            $sentinel = Join-Path $dataDir "e2e-preserve-data.txt"
            Set-Content -LiteralPath $sentinel -Value "preserve" -Encoding ASCII

            $wrapperPath = Join-Path $installDir "Support\Uninstall-Bridge.ps1"
            $quietArgs = '-NoProfile -ExecutionPolicy Bypass -File "' + $wrapperPath + '" -Quiet'
            $quietUninstall = Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -ArgumentList $quietArgs -Wait -PassThru
            if ($quietUninstall.ExitCode -ne 0) {
              throw "Quiet uninstall wrapper failed with exit code $($quietUninstall.ExitCode)."
            }

            Start-Sleep -Seconds 4

            if (-not (Test-Path -LiteralPath $sentinel -PathType Leaf)) {
              throw "Quiet uninstall unexpectedly deleted preserved user data."
            }
            if (Test-Path -LiteralPath $installedExe -PathType Leaf) {
              throw "Quiet uninstall did not remove the installed application."
            }

            Write-Host "Legacy update + uninstall wrapper E2E passed: $legacyTag -> $targetTag"
          }
          finally {
            if (Test-Path -LiteralPath $legacyWorktree) { git worktree remove --force $legacyWorktree }
            Remove-Item -LiteralPath $legacyPublish -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $legacyOutput -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $deltaDir -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $updateOutput -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Build incremental update EXEs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[dev-release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = "${{ github.sha }}"
          $short = $sha.Substring(0, 7)
          $targetTag = "dev-$short"
          $version = "0.1.${{ github.run_number }}.0"
          $outputDir = $PWD.Path

          .\scripts\create-publish-manifest.ps1 -PublishDir .\publish\win-x64 -Tag $targetTag -Commit $sha -OutputPath .\ChatGptDesktopLocalBridge-PublishManifest.json

          function Build-UpdateExe([string]$BaseTag, [string]$DeltaDir) {
            $resolvedDelta = (Resolve-Path $DeltaDir).Path
            ISCC.exe "/DDeltaDir=$resolvedDelta" "/DOutputDir=$outputDir" "/DBaseTag=$BaseTag" "/DTargetTag=$targetTag" "/DUpdateVersion=$version" ".\installer\DeltaUpdate.iss"

            $expected = Join-Path $PWD ("ChatGptDesktopLocalBridge-Update-from-" + $BaseTag + ".exe")
            if (-not (Test-Path -LiteralPath $expected)) {
              throw "Incremental update EXE was not produced for $BaseTag."
            }
          }

          # Normal exact-manifest bases: only releases whose exact publish bytes are known.
          $releaseRows = @(gh release list --limit 20 --json tagName,isPrerelease,publishedAt | ConvertFrom-Json) |
            Where-Object { $_.isPrerelease -and $_.tagName -like "dev-*" } |
            Sort-Object { [DateTimeOffset]$_.publishedAt } -Descending

          $exactBasesBuilt = 0
          foreach ($row in $releaseRows) {
            if ($exactBasesBuilt -ge 2) { break }

            $view = gh release view $row.tagName --json assets | ConvertFrom-Json
            $hasInstaller = @($view.assets | Where-Object { $_.name -eq "ChatGptDesktopLocalBridge-Setup.exe" }).Count -gt 0
            $hasManifest = @($view.assets | Where-Object { $_.name -eq "ChatGptDesktopLocalBridge-PublishManifest.json" }).Count -gt 0
            if (-not $hasInstaller -or -not $hasManifest) { continue }

            $safeTag = ($row.tagName -replace '[^A-Za-z0-9._-]', '_')
            $manifestDir = Join-Path $PWD ("manifest-" + $safeTag)
            $deltaDir = Join-Path $PWD ("delta-" + $safeTag)
            New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null

            try {
              gh release download $row.tagName --pattern "ChatGptDesktopLocalBridge-PublishManifest.json" --dir $manifestDir --clobber
              $baseManifest = Join-Path $manifestDir "ChatGptDesktopLocalBridge-PublishManifest.json"
              .\scripts\build-delta-update.ps1 -BaseManifestPath $baseManifest -CurrentPublishDir .\publish\win-x64 -BaseTag $row.tagName -TargetTag $targetTag -TargetCommit $sha -OutputPath $deltaDir
              Build-UpdateExe $row.tagName $deltaDir
              $exactBasesBuilt++
            }
            finally {
              Remove-Item -LiteralPath $manifestDir -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath $deltaDir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          # One-time owner migration from the actually installed legacy Setup.
          $legacyTag = "dev-1d00606"
          $legacyCommit = "1d006065462d442e429478158e655e3edc5c7938"
          $legacyInstallerVersion = "0.1.24.0"
          $legacyWorktree = Join-Path $PWD "legacy-dev-1d00606"
          $legacyPublish = Join-Path $PWD "publish-legacy-dev-1d00606"
          $legacyDelta = Join-Path $PWD "delta-dev-1d00606"

          git worktree add --detach $legacyWorktree $legacyCommit
          try {
            dotnet publish (Join-Path $legacyWorktree "src\ChatGptDesktopLocalBridge\ChatGptDesktopLocalBridge.csproj") --configuration Release --runtime win-x64 --self-contained true --output $legacyPublish
            .\scripts\build-delta-update.ps1 -BasePublishDir $legacyPublish -LegacyInstallerVersion $legacyInstallerVersion -CurrentPublishDir .\publish\win-x64 -BaseTag $legacyTag -TargetTag $targetTag -TargetCommit $sha -OutputPath $legacyDelta
            Build-UpdateExe $legacyTag $legacyDelta
          }
          finally {
            git worktree remove --force $legacyWorktree
            Remove-Item -LiteralPath $legacyPublish -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $legacyDelta -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Verify GitHub CLI
        run: gh --version

      - name: Create development prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[dev-release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = "${{ github.sha }}"
          $short = $sha.Substring(0, 7)
          $tag = "dev-$short"
          $assets = @(".\ChatGptDesktopLocalBridge-Setup.exe", ".\ChatGptDesktopLocalBridge-PublishManifest.json")
          $assets += @(Get-ChildItem -Path ".\ChatGptDesktopLocalBridge-Update-from-*.exe" -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          gh release create $tag @assets --target $sha --prerelease --title "Development build $short" --notes "For ordinary upgrades use the matching small Update-from-*.exe. It validates the installed base, applies only changed files, rolls back on failure, restarts the app, and never touches the WebView2 profile. Setup.exe remains for first installation or fallback."

      - name: Enforce development release retention
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\cleanup-dev-releases.ps1 -KeepInstallable 2
